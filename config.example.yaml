# Copy this file to ~/.config/eve-sway-multibox/config.yaml.
# Bindings are active only while the configured workspace is focused.
# Use Sway bindsym syntax, for example: Mod4+Tab or Ctrl+Shift+space.
# Choose combinations that are not already bound globally.
workspace: 10

bindings:
  group_next: Ctrl+Tab
  group_previous: Ctrl+Shift+Tab
  client_next: Tab
  client_previous: Shift+Tab

# 0 means unlimited. When workspace 10 is not focused, every client uses the
# inactive limit.
fps:
  active: 120
  inactive: 10

# A launcher client/account may have up to three characters. The current
# window title is used to associate the window with its stable client group.
client_groups:
  main_client:
    - Main Character
    - Main Character Alt
  alt_client:
    - Alt One
    - Alt Two

# Groups and their internal client order. Entries refer to client_groups.
cycle_groups:
  main:
    - main_client
  alts:
    - alt_client
